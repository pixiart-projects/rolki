<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>/// R-77 PROTOKÓŁ: ROLKI REWIZJA ///</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      id="startScreen"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--color-bg);
        color: var(--color-main);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        cursor: pointer;
        z-index: 10000;
        font-family: 'Orbitron', sans-serif;
        text-transform: uppercase;
        letter-spacing: 2px;
        box-shadow: inset 0 0 50px rgba(230, 57, 70, 0.2);
      "
    >
      /// AKTYWACJA R-77 /// KLIKNIJ, ABY ROZPOCZĄĆ
    </div>

    <div class="background-css">
      <div class="animated-line"><div class="light"></div></div>
      <div class="flash"></div>
    </div>

    <div class="top-row">
      <div class="footer-reset">
        <div id="resetBtn" class="footer-button">RESET</div>
      </div>
      <button class="arrow-btn arrow-btn-left" id="leftBtn">&lt;</button>
      <div class="container" id="mainContainer"></div>
      <button class="arrow-btn" id="rightBtn">&gt;</button>
      <div class="footer-bar">
        <a href="instruction.html" class="footer-button">INSTRUKCJA</a>
        <a href="description.html" class="footer-button">OPIS</a>
      </div>
    </div>

    <audio id="rollSound" src="sounds/marble-roll.mp3" preload="auto"></audio>
    <audio id="hornSound" src="sounds/car-horn.mp3" preload="auto"></audio>
    <audio
      id="shockSound"
      src="sounds/shock_three-43050.mp3"
      preload="auto"
    ></audio>
    <audio
      id="clickSound"
      src="sounds/mixkit-cool-interface-click-tone-2568.wav"
      preload="auto"
    ></audio>
    <audio
      id="resetSound"
      src="sounds/board-start-38127.mp3"
      preload="auto"
    ></audio>

    <script src="script.js"></script>
  </body>
</html>
